name: Feature request
description: Propose a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem first, not only the solution. Check the [roadmap](https://github.com/dhanushbs10/vynlore/blob/master/docs/ROADMAP.md) and existing issues before opening a new one.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you propose
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This fits a local-first, Windows desktop music player.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user situation, not only the feature.
      placeholder: When I ... I cannot ..., so I have to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other players, or a smaller version of the idea.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback / audio engine
        - Library / scanning / tags
        - User interface
        - Settings / system integration
        - Playlists / M3U
        - Visualisation / lyrics / scrobbling
        - Documentation / developer experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - Yes, I can open a PR
        - Yes, with guidance
        - No, just suggesting
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, examples from other apps, edge cases, platform constraints.
    validations:
      required: false
