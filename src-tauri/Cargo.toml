[package]
name = "vynlore-audio"
version = "0.1.0"
default-run = "vynlore-audio"
edition = "2021"

[dependencies]
cpal = "0.15"
symphonia = { version = "0.5", features = ["flac"] }
rubato = "0.14"
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }
chrono = "0.4"
lofty = "0.8"
walkdir = "2.5"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
notify = "8.2.0"
dirs = "5.0"
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }
